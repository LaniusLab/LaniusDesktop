name: CI

# 代码检查挂在 main：push 到 main，以及面向 main 的 PR。
# 不在此流水线做安装包；打包见 release.yml（release 分支 + Changelog 门禁）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check
      - run: pnpm version:sync:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - run: ruff check engine
      - run: mypy engine/src
      - run: pytest engine/tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # generate_context! 在编译期校验 frontendDist 存在，需先构建前端
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tauri-build 要求 externalBin 路径存在；CI 用空 stub，真包见 engine:pack / release.yml
      - run: node scripts/ensure-sidecar-stub.mjs
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
