name: Release

# 打包门禁：仅在合并进 release 分支后的 push 上运行（不对「打开指向 release 的 PR」打包）。
# 当前只构建 Windows；macOS / Linux 打包已关闭。
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    # 防止从非 release 分支误触 workflow_dispatch 打出安装包
    if: github.ref == 'refs/heads/release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Version sync check
        run: pnpm version:sync:check

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then
            echo "package.json version is empty" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (from package.json)"

      - name: Build changelog for release notes
        id: changelog
        shell: bash
        run: |
          node scripts/release-changelog.mjs \
            --version "${{ steps.meta.outputs.version }}" \
            --out changelog-section.md
          {
            cat changelog-section.md
            echo ""
            echo "---"
            echo ""
            echo "## 预设冒烟"
            echo ""
            echo "1. 安装后打开应用，开始页选择「记事本多行输入」。"
            echo "2. 打开系统记事本（空文档）。"
            echo "3. 目标进程选「记事本」，点「试一次」。"
            echo "4. 记事本应出现三行预设文本。"
            echo ""
            echo "构建自 \`${{ github.sha }}\`（分支 \`release\`，Windows only）。"
          } > release-notes.md
          DELIM="CHANGELOG_EOF_$(node -p "require('crypto').randomBytes(8).toString('hex')")"
          {
            echo "body<<${DELIM}"
            cat release-notes.md
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Lanius ${{ steps.meta.outputs.tag }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ""
          projectPath: src-tauri
